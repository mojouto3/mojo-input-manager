name: Bug report
description: Report something that is not working correctly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps that lead to this issue
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 23H2
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Connected devices
      description: List the controllers, wheels, pedals, or other peripherals connected when this happened
    validations:
      required: false
  - type: input
    id: driver-versions
    attributes:
      label: Driver versions
      description: vJoy and HidHide driver versions, if known
    validations:
      required: false
  - type: dropdown
    id: elevated
    attributes:
      label: Was the app running as Administrator?
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true