    <text x="55" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#3ddb3d" text-anchor="middle" letter-spacing="0.5">Mapping</text>
  </g>
  <g transform="translate(670, 400)">
    <rect x="0" y="0" width="170" height="36" rx="18" fill="#3ddce81a" stroke="#3ddce84d"/>
    <text x="85" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#3ddce8" text-anchor="middle" letter-spacing="0.5">Device Filtering</text>
  </g>
