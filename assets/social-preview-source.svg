<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#181818"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glow)"/>
  <defs>
    <radialGradient id="glow" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#3ddb3d" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3ddb3d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(150, 175)">
    <rect x="70" y="110" width="60" height="60" rx="14" fill="#101d10" stroke="#3ddb3d" stroke-width="2"/>
    <rect x="38" y="20" width="26" height="150" rx="13" fill="#3ddb3d"/>
    <rect x="87" y="0" width="26" height="170" rx="13" fill="#3ddb3d"/>
    <rect x="136" y="20" width="26" height="150" rx="13" fill="#3ddb3d"/>
    <circle cx="100" cy="140" r="7" fill="#181818"/>
  </g>

  <text x="380" y="300" font-family="Arial, sans-serif" font-size="72" font-weight="700" fill="#ffffff" letter-spacing="1">Mojo Input Manager</text>
  <text x="380" y="350" font-family="Arial, sans-serif" font-size="26" fill="#8a8a8a" letter-spacing="0.5">Set up controllers once, choose what each game sees.</text>

  <g transform="translate(380, 400)">
    <rect x="0" y="0" width="150" height="36" rx="18" fill="#3ddb3d1a" stroke="#3ddb3d4d"/>
    <text x="75" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#3ddb3d" text-anchor="middle" letter-spacing="0.5">Virtual Devices</text>
  </g>
  <g transform="translate(545, 400)">
